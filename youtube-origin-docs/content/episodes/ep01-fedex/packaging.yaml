# Packaging for ep01. Titles: first one is used; the others go into Test & Compare.
titles:
  - The ENTIRE History of FedEx in 20 Minutes
  - FedEx Was 1 Mistake Away From Dying
  - How FedEx Quietly Took Over Your Front Door

description: |
  FedEx started as a college paper that legend says got a C — and survived because its founder flew to Las Vegas with the company's last $5,000.
  This is the complete history of FedEx: Fred Smith, the overnight hub in Memphis, the blackjack night, ZapMail, Amazon, and where FedEx goes next.

  In 1973, Federal Express launched with 14 small jets and delivered 186 packages on its first night. Within months it was losing money every week, and it came within days of running out of fuel money. Here's how it survived, how it became a verb, and why its biggest customer became its biggest rival.

  {CHAPTERS}

  Sources (selected):
  FedEx company history — https://www.fedex.com/en-us/about/company-info/history.html
  FedEx Form 10-K, fiscal 2026 — https://www.sec.gov/Archives/edgar/data/0001048911/000104891126000105/fdx-20260531.htm
  FedEx Freight spin-off (June 1, 2026) — https://newsroom.fedexfreight.com/fedex-freight-completes-spin-off-and-begins-trading-on-the-new-york-stock-exchange
  Roger Frock, "Changing How the World Does Business" (2006)
